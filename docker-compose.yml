version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend-network

  uploader:
    build:
      context: .
      dockerfile: Dockerfile.main
    ports:
      - "3002:3000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - backend-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - backend-network

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - backend-network

  # Web server service for serving static HTML files
  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html # Mount the 'web' directory
    ports:
      - "8080:80" # Expose port 8080 to access the static files
    networks:
      - backend-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:


networks:
  backend-network:
    driver: bridge
